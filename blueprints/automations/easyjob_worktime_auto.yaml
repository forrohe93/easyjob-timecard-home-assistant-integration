blueprint:
  name: easyjob Zeiterfassung automatisch starten/stoppen
  description: >
    Startet und stoppt die easyjob Zeiterfassung automatisch. Es gibt drei Auslöser,
    die beliebig kombiniert werden können. Die Zeiterfassung soll laufen, sobald
    **mindestens einer** davon zutrifft:


    * **Zonen** – die Person befindet sich in einer der gewählten Zonen

    * **Smarthome-Auslöser** – eine der gewählten Entitäten ist `an`
      (z. B. Home-Office-Schalter, Input Boolean, Binary Sensor, Zeitplan)

    * **Ressourcenstatus** – laut easyjob-Kalender gilt gerade einer der gewählten
      Ressourcenstatus. Dafür müssen die Status vorher in den Optionen der
      Integration als Binary Sensoren aktiviert werden („Status aktiv: …“).
      Optional zählt der Status nur, wenn zusätzlich eine Bedingung erfüllt ist
      (z. B. PC eingeschaltet oder Präsenz im Arbeitszimmer).


    Gestartet wird, wenn ein Auslöser zutreffend wird. Gestoppt wird, wenn ein Auslöser
    nicht mehr zutrifft **und** auch kein anderer mehr zutrifft. Eine manuell gestartete
    Zeiterfassung wird also nur gestoppt, wenn ein Auslöser tatsächlich wegfällt.


    Optional wird ein Gerät mit der Companion App benachrichtigt, wenn die Zeiterfassung
    gestartet oder gestoppt wurde. Pro Auslöser-Art kann stattdessen auch nachgefragt
    werden – die Aktion wird dann erst nach „Ja“ ausgeführt.


    Über einen Pause-Schalter lässt sich die Automation vorübergehend deaktivieren.
  domain: automation
  author: Heiko Forro
  source_url: https://github.com/forrohe93/easyjob-timecard-home-assistant-integration/blob/main/blueprints/automations/easyjob_worktime_auto.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    worktime:
      name: Zeiterfassung
      icon: mdi:clock-check
      input:
        worktime_switch:
          name: Zeiterfassungs-Schalter
          description: Der Schalter „Zeiterfassung“ der easyjob Timecard Integration.
          selector:
            entity:
              filter:
                - domain: switch
                  integration: easyjob_timecard

    zone_section:
      name: Zonen
      icon: mdi:map-marker-radius
      collapsed: true
      input:
        person:
          name: Person
          description: Die Person, deren Aufenthaltsort ausgewertet wird.
          default: ""
          selector:
            entity:
              filter:
                - domain: person
        zones:
          name: Zonen
          description: In diesen Zonen läuft die Zeiterfassung (z. B. Büro, Lager).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: zone
        ask_zone:
          name: Nachfragen
          description: Per Benachrichtigung fragen, statt automatisch zu starten/stoppen.
          default: false
          selector:
            boolean: {}

    trigger_section:
      name: Smarthome-Auslöser
      icon: mdi:home-account
      collapsed: true
      input:
        trigger_entities:
          name: Auslöser-Entitäten
          description: Ist eine davon `an`, läuft die Zeiterfassung (z. B. ein Home-Office-Schalter).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_boolean
                    - switch
                    - binary_sensor
                    - schedule
        ask_trigger:
          name: Nachfragen
          description: Per Benachrichtigung fragen, statt automatisch zu starten/stoppen.
          default: false
          selector:
            boolean: {}

    status_section:
      name: Ressourcenstatus (easyjob-Kalender)
      icon: mdi:calendar-check
      collapsed: true
      input:
        status_sensors:
          name: Ressourcenstatus-Sensoren
          description: >
            Die Binary Sensoren „Status aktiv: …“ der Integration. Fehlt ein Status,
            zuerst in den Optionen der Integration aktivieren.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  integration: easyjob_timecard
        status_conditions:
          name: Zusätzliche Bedingung (optional)
          description: >
            Wenn gesetzt, zählt der Ressourcenstatus nur, solange auch mindestens eine
            dieser Entitäten `an` ist – z. B. PC eingeschaltet oder Präsenz im
            Arbeitszimmer. Leer lassen, damit der Status allein reicht.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_boolean
                    - switch
                    - binary_sensor
                    - schedule
        ask_status:
          name: Nachfragen
          description: Per Benachrichtigung fragen, statt automatisch zu starten/stoppen.
          default: false
          selector:
            boolean: {}

    notify_section:
      name: Benachrichtigung
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notify_device:
          name: Benachrichtigungs-Ziel
          description: >
            Gerät mit der Home Assistant Companion App. Wird für Infos und für die
            Nachfragen („Nachfragen“ bei den Auslösern) verwendet. Ohne Gerät wird
            nicht benachrichtigt und nie nachgefragt.
          default: ""
          selector:
            device:
              filter:
                - integration: mobile_app
        notify_on_start:
          name: Bei Start benachrichtigen
          description: Info, wenn die Zeiterfassung automatisch gestartet wurde.
          default: true
          selector:
            boolean: {}
        notify_on_stop:
          name: Bei Stopp benachrichtigen
          description: Info, wenn die Zeiterfassung automatisch gestoppt wurde.
          default: false
          selector:
            boolean: {}
        ask_timeout:
          name: Wartezeit auf Antwort
          description: Wird eine Nachfrage in dieser Zeit nicht beantwortet, passiert nichts.
          default:
            minutes: 15
          selector:
            duration: {}

    options_section:
      name: Optionen
      icon: mdi:cog
      collapsed: true
      input:
        pause_entities:
          name: Pause-Schalter
          description: Solange einer dieser Schalter `an` ist, macht die Automation nichts.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_boolean
                    - switch
        allow_start:
          name: Automatisch starten
          default: true
          selector:
            boolean: {}
        allow_stop:
          name: Automatisch stoppen
          default: true
          selector:
            boolean: {}
        stop_delay:
          name: Stopp-Verzögerung
          description: >
            So lange wird nach Wegfall eines Auslösers gewartet, bevor gestoppt wird.
            Trifft in der Zeit wieder ein Auslöser zu, wird nicht gestoppt. Hilft gegen
            GPS-Sprünge am Zonenrand.
          default:
            minutes: 0
          selector:
            duration: {}

# parallel: a pending stop (stop_delay) must not be cancelled by unrelated triggers,
# e.g. other persons entering/leaving one of the zones.
mode: parallel
max: 25
max_exceeded: silent

variables:
  person: !input person
  zones: !input zones
  trigger_entities: !input trigger_entities
  status_sensors: !input status_sensors
  status_conditions: !input status_conditions
  pause_entities: !input pause_entities
  allow_start: !input allow_start
  allow_stop: !input allow_stop
  ask_zone: !input ask_zone
  ask_trigger: !input ask_trigger
  ask_status: !input ask_status
  notify_device: !input notify_device
  notify_on_start: !input notify_on_start
  notify_on_stop: !input notify_on_stop
  # Companion app notify action, e.g. notify.mobile_app_pixel_8 ('' if no device selected)
  notify_service: >-
    {%- if notify_device -%}
      notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}
    {%- endif -%}
  source: >-
    {{ 'zone' if trigger.id == 'zone'
       else 'trigger' if trigger.id in ['source_on', 'source_off']
       else 'status' }}
  ask: >-
    {{ notify_service != ''
       and ((source == 'zone' and ask_zone)
         or (source == 'trigger' and ask_trigger)
         or (source == 'status' and ask_status)) }}
  reason: "{{ trigger.to_state.name if trigger.to_state is not none else '' }}"
  status_any_on: "{{ status_sensors | select('is_state', 'on') | list | count > 0 }}"
  status_condition_ok: >-
    {{ status_conditions | count == 0
       or status_conditions | select('is_state', 'on') | list | count > 0 }}
  # on = a trigger source became active, off = became inactive, none = irrelevant event
  edge: >-
    {%- if trigger.id == 'zone' -%}
      {%- set before = person != '' and trigger.from_state is not none
          and person in (trigger.from_state.attributes.persons | default([])) -%}
      {%- set after = person != '' and trigger.to_state is not none
          and person in (trigger.to_state.attributes.persons | default([])) -%}
      {{ 'on' if after and not before else 'off' if before and not after else 'none' }}
    {%- elif trigger.id == 'source_on' -%}
      on
    {%- elif trigger.id == 'status_on' -%}
      {{ 'on' if status_condition_ok else 'none' }}
    {%- elif trigger.id == 'status_off' -%}
      {{ 'off' if status_condition_ok else 'none' }}
    {%- elif trigger.id == 'condition_on' -%}
      {{ 'on' if status_any_on else 'none' }}
    {%- elif trigger.id == 'condition_off' -%}
      {{ 'off' if status_any_on else 'none' }}
    {%- else -%}
      off
    {%- endif -%}

triggers:
  # Zone state = number of persons; also fires on changes of the "persons" attribute.
  - trigger: state
    entity_id: !input zones
    id: zone
  - trigger: state
    entity_id: !input trigger_entities
    to: "on"
    not_from: [unavailable, unknown]
    id: source_on
  - trigger: state
    entity_id: !input trigger_entities
    from: "on"
    not_to: [unavailable, unknown]
    id: source_off
  - trigger: state
    entity_id: !input status_sensors
    to: "on"
    not_from: [unavailable, unknown]
    id: status_on
  - trigger: state
    entity_id: !input status_sensors
    from: "on"
    not_to: [unavailable, unknown]
    id: status_off
  - trigger: state
    entity_id: !input status_conditions
    to: "on"
    not_from: [unavailable, unknown]
    id: condition_on
  - trigger: state
    entity_id: !input status_conditions
    from: "on"
    not_to: [unavailable, unknown]
    id: condition_off

conditions:
  - alias: Relevantes Ereignis
    condition: template
    value_template: "{{ edge in ['on', 'off'] }}"
  - alias: Nicht pausiert
    condition: template
    value_template: "{{ pause_entities | select('is_state', 'on') | list | count == 0 }}"

actions:
  - choose:
      - alias: Starten
        conditions:
          - condition: template
            value_template: "{{ edge == 'on' and allow_start }}"
          - condition: state
            entity_id: !input worktime_switch
            state: "off"
        sequence:
          - if:
              - condition: template
                value_template: "{{ ask }}"
            then:
              # Unique per run, so parallel questions don't answer each other.
              - variables:
                  run_token: "{{ now().timestamp() | string | replace('.', '') }}"
                  answer_yes: "{{ 'EASYJOB_YES_' ~ run_token }}"
                  answer_no: "{{ 'EASYJOB_NO_' ~ run_token }}"
                  notify_tag: "{{ 'easyjob_worktime_' ~ run_token }}"
              - action: "{{ notify_service }}"
                data:
                  title: Zeiterfassung
                  message: "Zeiterfassung starten? (Auslöser: {{ reason }})"
                  data:
                    tag: "{{ notify_tag }}"
                    actions:
                      - action: "{{ answer_yes }}"
                        title: "Ja"
                      - action: "{{ answer_no }}"
                        title: "Nein"
              - wait_for_trigger:
                  - trigger: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ answer_yes }}"
                  - trigger: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ answer_no }}"
                timeout: !input ask_timeout
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger is none }}"
                then:
                  - action: "{{ notify_service }}"
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ notify_tag }}"
                  - stop: Keine Antwort auf die Nachfrage.
              - condition: template
                value_template: "{{ wait.trigger.event.data.action == answer_yes }}"
              - condition: state
                entity_id: !input worktime_switch
                state: "off"
              - action: switch.turn_on
                target:
                  entity_id: !input worktime_switch
            else:
              - action: switch.turn_on
                target:
                  entity_id: !input worktime_switch
              - if:
                  - condition: template
                    value_template: "{{ notify_on_start and notify_service != '' }}"
                then:
                  - action: "{{ notify_service }}"
                    data:
                      title: Zeiterfassung
                      message: "Zeiterfassung gestartet (Auslöser: {{ reason }})"

      - alias: Stoppen
        conditions:
          - condition: template
            value_template: "{{ edge == 'off' and allow_stop }}"
        sequence:
          - delay: !input stop_delay
          # Re-evaluate after the delay: stop only if no trigger source is active anymore.
          - variables:
              any_active: >-
                {%- set ns = namespace(in_zone=false) -%}
                {%- for z in zones -%}
                  {%- if person != '' and person in (state_attr(z, 'persons') or []) -%}
                    {%- set ns.in_zone = true -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set status_on = status_sensors | select('is_state', 'on') | list | count > 0 -%}
                {%- set condition_ok = status_conditions | count == 0
                    or status_conditions | select('is_state', 'on') | list | count > 0 -%}
                {{ ns.in_zone
                   or trigger_entities | select('is_state', 'on') | list | count > 0
                   or (status_on and condition_ok) }}
          - condition: template
            value_template: "{{ not any_active }}"
          - condition: template
            value_template: "{{ pause_entities | select('is_state', 'on') | list | count == 0 }}"
          - condition: state
            entity_id: !input worktime_switch
            state: "on"
          - if:
              - condition: template
                value_template: "{{ ask }}"
            then:
              # Unique per run, so parallel questions don't answer each other.
              - variables:
                  run_token: "{{ now().timestamp() | string | replace('.', '') }}"
                  answer_yes: "{{ 'EASYJOB_YES_' ~ run_token }}"
                  answer_no: "{{ 'EASYJOB_NO_' ~ run_token }}"
                  notify_tag: "{{ 'easyjob_worktime_' ~ run_token }}"
              - action: "{{ notify_service }}"
                data:
                  title: Zeiterfassung
                  message: "Zeiterfassung beenden? (Auslöser: {{ reason }})"
                  data:
                    tag: "{{ notify_tag }}"
                    actions:
                      - action: "{{ answer_yes }}"
                        title: "Ja"
                      - action: "{{ answer_no }}"
                        title: "Nein"
              - wait_for_trigger:
                  - trigger: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ answer_yes }}"
                  - trigger: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ answer_no }}"
                timeout: !input ask_timeout
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger is none }}"
                then:
                  - action: "{{ notify_service }}"
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ notify_tag }}"
                  - stop: Keine Antwort auf die Nachfrage.
              - condition: template
                value_template: "{{ wait.trigger.event.data.action == answer_yes }}"
              - condition: state
                entity_id: !input worktime_switch
                state: "on"
              - action: switch.turn_off
                target:
                  entity_id: !input worktime_switch
            else:
              - action: switch.turn_off
                target:
                  entity_id: !input worktime_switch
              - if:
                  - condition: template
                    value_template: "{{ notify_on_stop and notify_service != '' }}"
                then:
                  - action: "{{ notify_service }}"
                    data:
                      title: Zeiterfassung
                      message: "Zeiterfassung gestoppt (Auslöser: {{ reason }})"
